<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máquinas · Painel de Produção</title>

  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="maquinas.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/auth.js"></script>
  <script src="../shared/supabaseClient.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="../shared/img/logo-notria.png" alt="Notria">
      <div>
        <h1>Painel de Produção</h1>
        <span>MÁQUINAS · TEMPO REAL</span>
      </div>
    </div>

    <nav class="nav-menu">
      <a class="menu-btn" href="../gestor/gestor.html" data-papel="gestor">Dashboard</a>
      <a class="menu-btn active" href="maquinas.html">Máquinas</a>
      <a class="menu-btn" href="../supervisor/supervisor.html" data-papel="gestor">Supervisor</a>
    </nav>

    <div class="topbar-right">
      <span class="status-pill" id="connection-status">
        <span class="dot"></span>
        <span id="connection-text">conectando...</span>
      </span>
      <span class="time-badge">
        atualizado às <strong id="last-update">--</strong>
      </span>
    </div>
  </header>

  <main class="main">

    <div class="page-title">
      <h2>Máquinas</h2>
      <p>Status ao vivo de cada máquina — clique num card para ver detalhes.</p>
    </div>

    <section class="kpi-row">
      <div class="kpi rodando">
        <span class="kpi-label">RODANDO</span>
        <strong id="kpi-rodando">0</strong>
      </div>
      <div class="kpi parada">
        <span class="kpi-label">PARADA</span>
        <strong id="kpi-parada">0</strong>
      </div>
      <div class="kpi setup">
        <span class="kpi-label">EM SETUP</span>
        <strong id="kpi-setup">0</strong>
      </div>
    </section>

    <section class="machines-grid" id="machines-grid">
      <div class="empty-message">Carregando máquinas...</div>
    </section>

  </main>

  <script src="maquinas.js"></script>
</body>
</html>
