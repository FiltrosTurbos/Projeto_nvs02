<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Produção · Login</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="index.css">
  <script src="../shared/auth.js"></script>
</head>
<body class="login-body">

  <div class="login-split">

    <div class="login-brand">
      <div class="login-brand-inner">
        <img src="../shared/img/logo-notria.png" alt="Notria" class="login-logo">

        <h1 class="login-heading">
          Painel de<br>Produção
        </h1>

        <div class="login-meta">
          <span id="login-relogio">--:--:--</span>
          <span class="login-meta-sep">·</span>
          <span id="login-data">--</span>
        </div>
      </div>
    </div>

    <div class="login-acesso">

      <p class="login-pergunta">Quem está acessando?</p>

      <button class="acesso-opcao" data-selecionar-papel="operador">
        <div class="acesso-opcao-topo">
          <span class="acesso-opcao-nome">Operador</span>
          <span class="acesso-opcao-seta">&rarr;</span>
        </div>
        <span class="acesso-opcao-desc">Acompanhar a máquina da minha linha</span>
      </button>

      <div class="acesso-opcao acesso-opcao-gestor" id="card-gestor">
        <div class="acesso-opcao-topo">
          <span class="acesso-opcao-nome">Gestor</span>
          <span class="acesso-opcao-seta" id="seta-gestor">&rarr;</span>
        </div>
        <span class="acesso-opcao-desc">Dashboard, Máquinas e Supervisor</span>

        <div class="senha-area" id="senha-area" hidden>
          <input
            type="password"
            id="input-senha-gestor"
            class="senha-input"
            placeholder="Senha do gestor"
            autocomplete="current-password"
          >
          <button class="btn senha-btn" id="btn-entrar-gestor">Entrar</button>
        </div>

        <span class="senha-erro" id="senha-erro" hidden>Senha incorreta</span>
      </div>

    </div>

  </div>

  <script src="index.js"></script>
</body>
</html>
